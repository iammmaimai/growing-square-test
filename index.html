<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Collective Square</title>
  <style>
    /* Centers the square and makes the background dark */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #111;
      overflow: hidden; /* Prevents scrollbars when the square gets huge */
    }

    /* The Square's base styling */
    #square {
      /* Flexbox to center the number inside */
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* Text styling for the numbers */
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      user-select: none; /* Prevents text highlighting on rapid clicks */
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);

      width: 100px;
      height: 100px;
      background-color: hsl(0, 100%, 50%); /* Starts red */
      cursor: pointer;
      border-radius: 12px;
      /* Smooth transitions for regular clicks */
      transition: width 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  height 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  background-color 0.1s ease;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    
    #square:active {
      transform: scale(0.95); /* Visual feedback on click */
    }

    /* The Major 100-Click Dopamine Burst */
    .dopamine-burst {
      animation: explosion 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes explosion {
      0% {
        transform: scale(1);
        filter: brightness(1);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      }
      20% {
        transform: scale(1.2) rotate(3deg);
        filter: brightness(2);
        box-shadow: 0 0 100px #fff, 0 0 150px currentColor;
      }
      40% {
        transform: scale(1.1) rotate(-3deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        filter: brightness(1);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      }
    }

    /* NEW: The Subtle 20-Click Mini Pop (Less Flashy) */
    .subtle-pop {
      animation: mini-pulse 0.3s ease-out forwards;
    }

    @keyframes mini-pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      }
      50% {
        transform: scale(1.06); /* Slight quick pop outward */
        box-shadow: 0 0 50px currentColor; /* Quick bright aura of its current color */
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      }
    }

    /* Full screen flash overlay for major milestones */
    #flash {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: white;
      pointer-events: none; /* Allows clicking right through it */
      opacity: 0;
      z-index: 9999;
    }

    .flash-active {
      animation: screen-flash 0.4s ease-out;
    }

    @keyframes screen-flash {
      0% { opacity: 0.8; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="flash"></div>

  <div id="square">0</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // --- STEP 1: YOUR CONFIG (PRESERVED) ---
    const firebaseConfig = {
      apiKey: "AIzaSyB13xmxwn8bnonujU27kE-LMmTEOxELYQc",
      authDomain: "growing-square-test.firebaseapp.com",
      projectId: "growing-square-test",
      storageBucket: "growing-square-test.firebasestorage.app",
      messagingSenderId: "445218377722",
      appId: "1:445218377722:web:d2dca26354c845f2e6de43"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const squareRef = ref(db, 'squareState');

    // DOM Elements & Settings
    const squareEl = document.getElementById('square');
    const flashEl = document.getElementById('flash');
    const BASE_SIZE = 100;
    const GROWTH_PER_CLICK = 2; // Keeps growing infinitely

    // Track local milestones so animations don't re-trigger on page reload
    let localClickCount = 0;

    // --- STEP 2: LISTEN FOR GLOBAL UPDATES ---
    onValue(squareRef, (snapshot) => {
      const data = snapshot.val() || { clicks: 0 };
      const totalClicks = data.clicks;

      // 1. Update text inside square
      squareEl.textContent = totalClicks;

      // 2. Infinite growth logic
      const newSize = BASE_SIZE + (totalClicks * GROWTH_PER_CLICK);
      squareEl.style.width = newSize + 'px';
      squareEl.style.height = newSize + 'px';

      // 3. Dynamically scale the font size so it grows nicely with the box
      squareEl.style.fontSize = Math.max(24, newSize * 0.18) + 'px';

      // 4. Color shifting wheel
      const newHue = totalClicks % 360;
      squareEl.style.backgroundColor = `hsl(${newHue}, 100%, 50%)`;

      // 5. Trigger dopamine celebration milestones
      if (totalClicks > 0 && totalClicks !== localClickCount) {
        if (totalClicks % 100 === 0) {
          // Major milestone (100, 200, 300...)
          triggerDopamineHit();
        } else if (totalClicks % 20 === 0) {
          // NEW: Minor milestone (20, 40, 60, 80, 120...)
          triggerSubtleHit();
        }
      }
      
      localClickCount = totalClicks;
    });

    // --- MAJOR CELEBRATION (100 CLICKS) ---
    function triggerDopamineHit() {
      // Clean up past mini-classes so animations don't conflict
      squareEl.classList.remove('subtle-pop');

      // Trigger full-screen flash
      flashEl.classList.remove('flash-active');
      void flashEl.offsetWidth; // JavaScript trick to force CSS restart
      flashEl.classList.add('flash-active');

      // Trigger violent square pulse/glow
      squareEl.classList.remove('dopamine-burst');
      void squareEl.offsetWidth; 
      squareEl.classList.add('dopamine-burst');
    }

    // --- NEW: MINOR CELEBRATION (20 CLICKS) ---
    function triggerSubtleHit() {
      // Clean up past big-classes so animations don't conflict
      squareEl.classList.remove('dopamine-burst');

      // Trigger a gentle popup pulse on the square (No screen flash!)
      squareEl.classList.remove('subtle-pop');
      void squareEl.offsetWidth; 
      squareEl.classList.add('subtle-pop');
    }

    // --- STEP 3: HANDLE LOCAL CLICKS ---
    let lastClickTime = 0;
    
    squareEl.addEventListener('click', () => {
      const now = Date.now();
      if (now - lastClickTime < 50) return; // ~20 clicks max per second per user
      lastClickTime = now;

      // Increment global counter
      update(ref(db), {
        'squareState/clicks': increment(1)
      });
    });
  </script>
</body>
</html>
